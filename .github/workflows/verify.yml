# Verifies Phase 5 (ADR 0008) on a real PostgreSQL 16, Redis 7 and gunicorn, so nobody has to install Docker. It is the automatic version of VERIFY.md.
#
# SAFETY (read this before changing anything):
#   - No secret is used anywhere in this file. There is no `secrets.` reference and no .env in the checkout (it is in .gitignore).
#   - Every API key is blanked below and demo mode is forced, exactly like docker-compose.verify.yml; scripts/ci_verify.py forces them again.
#   - Every step that runs our code has backend/ci/netguard on PYTHONPATH: any connection to a non-local address is refused and logged,
#     and the final step fails the run if one was even attempted. PostgreSQL and Redis are service containers on localhost.
#   - Nothing here can call Google, OpenRouter or a rail API. The permissions below are read-only.
name: verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Phase 5 on PostgreSQL 16, Redis 7 and gunicorn
    runs-on: ubuntu-latest
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripai
          POSTGRES_PASSWORD: tripai
          POSTGRES_DB: tripai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripai -d tripai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONUNBUFFERED: "1"
      VERIFY_OUT: ${{ github.workspace }}/verify-results
      # --- safe by construction: demo mode, and every key blank ---
      ENVIRONMENT: development
      DEMO_MODE: "true"
      LLM_PROVIDER: template
      GOOGLE_MAPS_SERVER_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_COMPAT_API_KEY: ""
      IRCTC_RAPIDAPI_KEY: ""
      RAILRADAR_API_KEY: ""
      WEB_SEARCH_API_KEY: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      FAST2SMS_API_KEY: ""
      SMTP_HOST: ""
      SMTP_PASSWORD: ""
      SMS_PROVIDER: console
      OTP_RESEND_SECONDS: "0"
      RATE_LIMIT_ENABLED: "false"
      BUDGET_MODE: "off"
      RAIL_REFRESH_DAILY_CAP: "0"
      LOG_LEVEL: WARNING

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install PostgreSQL client tools (pg_dump, pg_restore, psql)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client
          pg_dump --version

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: "0. Safety — keys blank, demo mode, no .env, network guard works"
        id: safety
        run: python scripts/ci_verify.py safety

      # From here on every step runs only if the safety step passed, and runs even if an earlier verification step failed,
      # so one failure never hides the others.

      - name: "2. Migrations — up, down and up again on PostgreSQL"
        if: always() && steps.safety.outcome == 'success'
        run: python scripts/ci_verify.py migrations

      - name: "4. Full test suite on PostgreSQL"
        if: always() && steps.safety.outcome == 'success'
        run: python scripts/ci_verify.py tests

      - name: "1+3. The API under gunicorn with 2 workers (entrypoint, queue, idempotency, burst of 10)"
        if: always() && steps.safety.outcome == 'success'
        run: python scripts/ci_verify.py gunicorn

      - name: "5. Pool arithmetic and the production guard"
        if: always() && steps.safety.outcome == 'success'
        run: python scripts/ci_verify.py config

      - name: "3a. Proxy trust and send-code limits under the real server (X-Forwarded-For, India-only, 3 an hour)"
        if: always() && steps.safety.outcome == 'success'
        run: python scripts/ci_verify.py proxy

      - name: "6. Redis-backed paths (readiness, cache tier, stop and start Redis)"
        if: always() && steps.safety.outcome == 'success'
        run: python scripts/ci_verify.py redis

      - name: "8. Backup script, retention and the restore drill"
        if: always() && steps.safety.outcome == 'success'
        run: python scripts/ci_verify.py backup

      - name: "9. Load check with the realistic latency mix (PostgreSQL)"
        if: always() && steps.safety.outcome == 'success'
        run: python scripts/ci_verify.py load

      - name: "7. Crash test — kill the backend mid-plan, assert exactly one refund"
        if: always() && steps.safety.outcome == 'success'
        run: python scripts/ci_verify.py crash

      - name: Results (also written to the run summary)
        if: always()
        run: python scripts/ci_verify.py summary

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          path: verify-results/
          if-no-files-found: warn
          retention-days: 30
